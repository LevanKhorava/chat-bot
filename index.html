<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Ventis - Fashion, Home Design & Lifestyle. Shop live with a stylist in English or Georgian."
    />
    <title>Ventis — Fashion, Home Design & Lifestyle</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    />
    <script
      defer
      src="https://www.gstatic.com/chat-messenger/sdk/prod/v1.16/chat-messenger.js"
    ></script>
    <link
      rel="stylesheet"
      href="https://www.gstatic.com/chat-messenger/sdk/prod/v1.16/themes/chat-messenger-default.css"
    />
    <link
      rel="stylesheet"
      href="https://www.gstatic.com/chat-messenger/sdk/prod/v1.16/themes/chat-messenger-layout.css"
    />
    <style>
      /* Floating chat panel pinned to the bottom-right corner. The chat stays
         mounted the whole time; we only toggle the wrapper's visibility so the
         session (and the "country" variable) survives collapse/expand. */
      #cx-chat-widget {
        position: fixed;
        right: 20px;
        bottom: 20px;
        z-index: 999;
        width: 400px;
        max-width: calc(100vw - 40px);
        height: 600px;
        max-height: calc(100vh - 40px);
        border-radius: 16px;
        overflow: hidden;
        box-shadow: 0 12px 32px rgba(17, 17, 17, 0.28);
        transition: opacity 0.2s ease;
      }
      /* Collapsed: hidden but kept in layout so the conversation's scroll
         position is preserved when reopened (session stays alive). */
      #cx-chat-widget.cx-collapsed {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      chat-messenger {
        width: 100%;
        height: 100%;
      }

      /* On mobile the chat SDK renders full-screen (max-width: 600px), so the
         floating wrapper must go full-screen too — otherwise the custom close
         button, which is anchored to this wrapper, floats in the middle of the
         screen instead of the panel's top-right corner. */
      @media (max-width: 600px) {
        #cx-chat-widget {
          top: 0;
          right: 0;
          bottom: 0;
          left: 0;
          width: 100vw;
          max-width: 100vw;
          height: 100vh;
          max-height: 100vh;
          border-radius: 0;
        }
      }

      /* Launcher icon shown when the chat is collapsed */
      #cx-chat-launcher {
        position: fixed;
        right: 20px;
        bottom: 20px;
        z-index: 1000;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 56px;
        height: 56px;
        padding: 0;
        border: none;
        border-radius: 9999px;
        background: #18d0b2;
        color: #1a1a1a;
        cursor: pointer;
        box-shadow: 0 8px 24px rgba(2, 79, 84, 0.35);
        transition:
          transform 0.15s ease,
          background-color 0.15s ease;
      }
      #cx-chat-launcher:hover {
        background: #12b39c;
        transform: translateY(-1px);
      }
      #cx-chat-launcher:focus-visible {
        outline: 3px solid rgba(24, 208, 178, 0.45);
        outline-offset: 2px;
      }
      #cx-chat-launcher[hidden] {
        display: none;
      }

      /* Collapse (close) control sits at the panel's top-right corner */
      #cx-chat-close {
        position: absolute;
        top: 10px;
        right: 12px;
        z-index: 2;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 32px;
        height: 32px;
        padding: 0;
        border: none;
        border-radius: 9999px;
        background: rgba(0, 0, 0, 0.06);
        color: #1a1a1a;
        cursor: pointer;
        transition: background-color 0.15s ease;
      }
      #cx-chat-close:hover {
        background: rgba(0, 0, 0, 0.12);
      }
      #cx-chat-close:focus-visible {
        outline: 2px solid rgba(24, 208, 178, 0.6);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      window.addEventListener("chat-messenger-loaded", () => {
        chatSdk.registerContext(
          chatSdk.prebuilts.ces.createContext({
            deploymentName:
              "projects/660780940216/locations/eu/apps/6308cd9f-f98f-4e32-a9b4-9ff8388df9b2/deployments/ceaf5d81-5e70-4b2d-bb22-0af34e723c8c",
            tokenBroker: {
              enableTokenBroker: true,
              enableRecaptcha: false,
            },
          }),
        );
      });
    </script>

    <!-- Launcher icon: opens the chat -->
    <button id="cx-chat-launcher" type="button" aria-label="Open chat">
      <svg
        width="26"
        height="26"
        viewBox="0 0 24 24"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
        aria-hidden="true"
      >
        <path
          d="M4 4h16a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H8l-4 4V5a1 1 0 0 1 1-1z"
          fill="currentColor"
        />
      </svg>
    </button>

    <!-- Update the url-allowlist attribute with a comma-separated list of origins allowed to render images -->
    <div id="cx-chat-widget" class="cx-collapsed">
      <button id="cx-chat-close" type="button" aria-label="Close chat">
        <svg
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
          aria-hidden="true"
        >
          <path
            d="M6 6l12 12M18 6L6 18"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          />
        </svg>
      </button>
      <chat-messenger url-allowlist="*" color-scheme="light">
        <chat-messenger-container
          chat-title="VENTIS"
          chat-title-icon="https://gstatic.com/dialogflow-console/common/assets/ccai-favicons/conversational_agents.png"
          enable-file-upload
          enable-audio-input
        ></chat-messenger-container>
      </chat-messenger>
    </div>

    <script>
      // Toggle the chat between the launcher icon and the open panel.
      (function () {
        var widget = document.getElementById("cx-chat-widget");
        var launcher = document.getElementById("cx-chat-launcher");
        var closeBtn = document.getElementById("cx-chat-close");
        launcher.addEventListener("click", function () {
          widget.classList.remove("cx-collapsed");
          launcher.hidden = true;
        });
        closeBtn.addEventListener("click", function () {
          widget.classList.add("cx-collapsed");
          launcher.hidden = false;
        });
      })();
    </script>
  </body>
</html>
